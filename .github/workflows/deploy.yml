name: Deploy to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create SMTP config
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cat > api/config.php <<EOF
          <?php

          define('SMTP_HOST', 'smtp.hostinger.com');
          define('SMTP_PORT', 587);
          define('SMTP_USERNAME', 'bookings@uranoteholidays.com');
          define('SMTP_PASSWORD', '${SMTP_PASSWORD}');
          define('ADMIN_EMAIL', 'himachalcabsonline01@gmail.com');
          EOF

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.HOSTINGER_SSH_KEY }}' > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

          ssh-keyscan -H -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_HOST }}" > ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/hostinger_key \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo SSH connection successful"

      - name: Deploy
        run: |
          rsync -avz \
            --exclude='.git/' \
            -e "ssh -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_PORT }}" \
            ./ \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_TARGET }}"
